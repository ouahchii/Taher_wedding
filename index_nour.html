@supports (height:1svh){:root{--ch:min(80svh,152vw)}}
:root{
  --cw:calc(var(--ch) * .5625);
  --ow:min(calc(100vw - 32px),calc(var(--cw) * 2.05));
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
html.is-locked,html.is-locked body{overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-deep);outline-offset:4px}

/* ---------- room dimming + letterbox bars ---------- */
.veil{position:fixed;inset:0;z-index:10;background:var(--dim);opacity:0;pointer-events:none;transition:opacity .9s ease}
.bar{position:fixed;left:0;right:0;z-index:30;background:var(--bars);height:var(--bar);pointer-events:none;transition:transform .85s cubic-bezier(.7,0,.2,1)}
.bar.t{top:0;height:calc(var(--bar) + env(safe-area-inset-top,0px));transform:translateY(-101%)}
.bar.b{bottom:0;height:calc(var(--bar) + env(safe-area-inset-bottom,0px));transform:translateY(101%)}
.opening .veil{opacity:1}
.opening .bar{transform:none}
.done .veil{opacity:0;transition-duration:1.3s}
.done .bar.t{transform:translateY(-101%);transition-duration:1s}
.done .bar.b{transform:translateY(101%);transition-duration:1s}

/* ---------- stage: the card ---------- */
.stage{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding-inline:16px;overflow-x:clip}
.card{position:relative;z-index:20;width:var(--cw);height:var(--ch);transition:width 1.4s cubic-bezier(.65,0,.25,1),opacity .45s ease;animation:breathe 4.2s ease-in-out infinite}
.opening .card{animation:none}
.wide .card{width:var(--ow)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}

.inside{position:absolute;inset:0;isolation:isolate;z-index:1;background:var(--paper);overflow:hidden;display:grid;place-items:center;
  box-shadow:0 34px 60px -26px rgba(70,38,6,.5),0 10px 24px -12px rgba(70,38,6,.35),0 0 0 1px rgba(167,126,64,.28)}
.inside::before{content:"";position:absolute;inset:10px;border:1px solid rgba(167,126,64,.5);pointer-events:none}

.closed{position:absolute;z-index:5;top:0;left:50%;width:var(--cw);height:100%;transform:translateX(-50%);padding:0;border:0;background:none;
  cursor:pointer;perspective:1800px;-webkit-tap-highlight-color:transparent;
  filter:drop-shadow(0 22px 26px rgba(70,38,6,.28))}
.half{position:absolute;top:0;height:100%;width:calc(var(--cw) / 2 + .5px);background-image:var(--card-img);background-repeat:no-repeat;background-size:var(--cw) var(--ch);
  transition:transform 1.4s cubic-bezier(.6,0,.2,1),opacity .8s ease .5s}
.half.l{left:0;background-position:0 0;transform-origin:0 50%}
.half.r{right:0;background-position:100% 0;transform-origin:100% 50%}
.doors .half.l{transform:rotateY(-104deg);opacity:0}
.doors .half.r{transform:rotateY(104deg);opacity:0}
.doors .closed{pointer-events:none;visibility:hidden;transition:visibility 0s 1.9s}
@media (hover:hover){.closed:hover .half.l{transform:rotateY(-5deg)}.closed:hover .half.r{transform:rotateY(5deg)}
  .doors .closed:hover .half.l{transform:rotateY(-104deg)}.doors .closed:hover .half.r{transform:rotateY(104deg)}}

.names{position:relative;z-index:2;margin:0;display:flex;flex-direction:column;align-items:center;gap:.1rem;text-align:center;font-weight:400;
  opacity:0;transform:translateY(10px);transition:opacity 1.2s ease,transform 1.2s ease}
.doors .names{opacity:1;transform:none;transition-delay:.8s}
.nm{font-family:var(--script);font-size:clamp(3.6rem,12vw,6.4rem);line-height:1.08;color:var(--ink);padding-inline:.1em}
.and{font-family:var(--serif);font-style:italic;font-size:clamp(1.25rem,3.2vw,1.7rem);letter-spacing:.14em;color:var(--gold-deep)}

/* ---------- lifted motif (feathered so it sits on the paper) ---------- */
.motif{position:absolute;pointer-events:none;background-repeat:no-repeat;background-size:100% 100%;opacity:.95;
  -webkit-mask-composite:source-in;mask-composite:intersect}
.motif.a{top:0;left:0;width:min(56%,300px);aspect-ratio:335 / 440;background-image:var(--motif-a);
  -webkit-mask-image:linear-gradient(to right,#000 52%,transparent 100%),linear-gradient(to bottom,#000 52%,transparent 100%);
  mask-image:linear-gradient(to right,#000 52%,transparent 100%),linear-gradient(to bottom,#000 52%,transparent 100%)}
.motif.b{right:0;bottom:0;width:min(48%,250px);aspect-ratio:230 / 425;background-image:var(--motif-b);
  -webkit-mask-image:linear-gradient(to left,#000 52%,transparent 100%),linear-gradient(to top,#000 52%,transparent 100%);
  mask-image:linear-gradient(to left,#000 52%,transparent 100%),linear-gradient(to top,#000 52%,transparent 100%)}

.sheet .motif{opacity:.8}
.sheet .motif.a{width:min(44%,300px)}
.sheet .motif.b{width:min(38%,250px)}

/* ---------- scroll cue ---------- */
.cue{position:absolute;left:50%;bottom:16px;z-index:5;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:8px 14px;background:none;border:0;cursor:pointer;color:var(--gold-deep);opacity:0;pointer-events:none;transition:opacity 1s ease 1.1s}
.done .cue{opacity:1;pointer-events:auto}
.cue span{font-family:var(--sans);font-size:.62rem;font-weight:500;letter-spacing:.42em;text-transform:uppercase;padding-left:.42em}
.cue svg{width:22px;height:12px;display:block;animation:nudge 2.2s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(5px);opacity:1}}

/* ---------- details: the inside of the card, continued ---------- */
.details{position:relative;display:flex;flex-direction:column;align-items:center;gap:56px;padding:12vh 16px 10vh}
.sheet{position:relative;width:min(100%,620px);background:var(--paper);overflow:hidden;padding:120px 28px 130px;text-align:center;
  box-shadow:0 34px 60px -30px rgba(70,38,6,.4),0 0 0 1px rgba(167,126,64,.28)}
.sheet::before{content:"";position:absolute;inset:10px;border:1px solid rgba(167,126,64,.5);pointer-events:none}
.rows{position:relative;z-index:2;margin:0;display:flex;flex-direction:column;align-items:center;gap:0}
.row{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 0;width:min(100%,340px)}
.row + .row{border-top:1px solid rgba(167,126,64,.4)}
.row dt{font-family:var(--sans);font-size:.68rem;font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:var(--gold-deep);padding-left:.42em}
.row dd{margin:0;font-family:var(--serif);font-size:clamp(1.9rem,6vw,2.5rem);font-weight:500;line-height:1.15;color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.rise{opacity:0;transform:translateY(16px);transition:opacity 1.2s ease,transform 1.2s ease}
.done .rise{opacity:1;transform:none;transition-delay:calc(.5s + var(--i,0) * .22s)}

.replay{font-family:var(--sans);font-size:.7rem;font-weight:500;letter-spacing:.38em;text-transform:uppercase;padding:16px 26px 16px calc(26px + .38em);
  background:none;color:var(--gold-deep);border:1px solid var(--gold);cursor:pointer;transition:background-color .3s ease,color .3s ease}
.replay:hover{background:var(--gold-deep);color:var(--paper)}
.replay:disabled{opacity:.5;cursor:default}

/* state resets */
.resetting .card{opacity:0}
.notrans *,.notrans *::before{transition:none!important;animation:none!important}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  .veil,.bar{display:none}
}
</style>

</head>
<body>

<div class="veil" aria-hidden="true"></div>
<div class="bar t" aria-hidden="true"></div>
<div class="bar b" aria-hidden="true"></div>

<main>
  <section class="stage" id="stage">
    <div class="card" id="card">
      <div class="inside">
        <span class="motif a" aria-hidden="true"></span>
        <span class="motif b" aria-hidden="true"></span>
        <h1 class="names"><span class="nm">Taher</span><span class="and">and</span><span class="nm">Samar</span></h1>
      </div>
      <button class="closed" id="open" type="button" aria-label="Open the invitation">
        <span class="half l"></span><span class="half r"></span>
      </button>
    </div>
    <button class="cue" id="cue" type="button" aria-label="Scroll to the details">
      <span>Scroll</span>
      <svg viewBox="0 0 22 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 1.5 11 10.5l9.5-9"/></svg>
    </button>
  </section>

  <section class="details" id="details">
    <div class="sheet">
      <span class="motif a" aria-hidden="true"></span>
      <span class="motif b" aria-hidden="true"></span>
      <dl class="rows">
        <div class="row rise" style="--i:0"><dt>Date</dt><dd>1 October 2026</dd></div>
        <div class="row rise" style="--i:1"><dt>Time</dt><dd>From 21:00</dd></div>
        <div class="row rise" style="--i:2"><dt>Place</dt><dd>Sousse</dd></div>
      </dl>
    </div>
    <button class="replay rise" id="replay" type="button" style="--i:3">Play again</button>
  </section>
</main>

<script>
(function(){
  var root=document.documentElement;
  var card=document.getElementById('card');
  var openBtn=document.getElementById('open');
  var cue=document.getElementById('cue');
  var replayBtn=document.getElementById('replay');
  var state='closed';
  var reduceMQ=window.matchMedia('(prefers-reduced-motion: reduce)');
  function reduced(){return reduceMQ.matches}
  function later(fn,ms){return setTimeout(fn,ms)}

  try{history.scrollRestoration='manual'}catch(e){}
  root.classList.add('is-locked');
  window.scrollTo(0,0);

  /* the page is one sealed screen until the card is opened (iOS ignores overflow:hidden on touch) */
  function block(e){if(root.classList.contains('is-locked')&&e.cancelable)e.preventDefault()}
  window.addEventListener('wheel',block,{passive:false});
  window.addEventListener('touchmove',block,{passive:false});

  function unlock(){root.classList.remove('is-locked');state='open'}

  function openCard(){
    if(state!=='closed')return;
    state='opening';
    if(reduced()){
      root.classList.add('doors','wide','done');
      unlock();return;
    }
    root.classList.add('opening');                       /* room dims, bars slide in */
    later(function(){root.classList.add('doors')},750);  /* the seal breaks, the card opens */
    later(function(){root.classList.add('wide')},1200);  /* the card widens */
    later(function(){root.classList.add('done');unlock()},5200); /* bars retract, details fade in */
  }
  openBtn.addEventListener('click',openCard);

  cue.addEventListener('click',function(){
    document.getElementById('details').scrollIntoView({behavior:reduced()?'auto':'smooth',block:'start'});
  });

  function resetAndPlay(){
    root.classList.add('resetting');
    later(function(){
      root.classList.add('notrans');
      root.classList.remove('opening','doors','wide','done');
      root.classList.add('is-locked');
      void root.offsetWidth;
      root.classList.remove('notrans');
      state='closed';
      later(function(){
        root.classList.remove('resetting');
        later(openCard,reduced()?0:900);
      },60);
    },reduced()?0:480);
  }

  replayBtn.addEventListener('click',function(){
    if(state!=='open')return;
    state='replaying';
    window.scrollTo({top:0,behavior:reduced()?'auto':'smooth'});
    var t0=Date.now();
    (function wait(){
      if(window.pageYOffset<=1||Date.now()-t0>2200){resetAndPlay();return}
      requestAnimationFrame(wait);
    })();
  });
})();
</script>

</body>
</html>
